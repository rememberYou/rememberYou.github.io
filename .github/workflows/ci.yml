# Checks a pull request before it is merged: formatting, types, a full build,
# browser tests, and Lighthouse against the budgets in lighthouserc.json. It
# deploys nothing.

name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, types, build, tests, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types and build
        run: npm run build

      # What a visitor sees: every section, image and link, the layout from a
      # 320px phone up, the four themes, and the page without JavaScript.
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm test

      # Fails if performance, accessibility, best practices or SEO drop below
      # their budgets, or if the page grows past 250 KB.
      - name: Lighthouse
        run: npm run lighthouse
