# Checks a pull request before it is merged: formatting, types, a full build,
# then the browser tests and the Lighthouse budgets (tests/). It deploys
# nothing.

name: CI

on:
  pull_request:
    branches: [develop, main]
  # node-lts.yml runs the same checks on a newer Node before switching to it.
  workflow_call:
    inputs:
      node-version:
        description: Overrides .nvmrc.
        type: string
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, types, build, tests, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types and build
        run: npm run build

      # What a visitor sees: every section, image and link, the layout from a
      # 320px phone up, the four themes, and the page without JavaScript. Then,
      # alone, Lighthouse: performance at least 95, accessibility, best
      # practices and SEO at 100, no layout shift, a page under 250 KB.
      - name: Browser tests and Lighthouse
        run: |
          npx playwright install --with-deps chromium webkit
          npm test
