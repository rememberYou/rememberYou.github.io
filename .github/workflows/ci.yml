# Checks a pull request before it is merged: formatting, types, and a full
# build, which also optimises every image. It deploys nothing.

name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Format, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Types and build
        run: npm run build
