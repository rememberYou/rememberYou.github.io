# Dependencies update themselves. Each week Dependabot opens one grouped pull
# request per ecosystem, against master, with releases at least 14 days old;
# dependabot-merge.yml merges it and deploys once CI, Lighthouse included,
# has passed. A pull request that fails CI stays open, and nothing ships.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6. Lift this once it
      # supports 7, or the build fails.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
