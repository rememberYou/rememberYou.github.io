# Dependencies update themselves. Each week Dependabot opens, against main
# and with releases at least 14 days old, one grouped pull request for the
# minor and patch updates of each ecosystem, and one per major update, so a
# major that breaks the build never holds back the others. dependabot-merge.yml
# merges each one and deploys once CI has passed; one that fails stays open,
# and Dependabot rebases it until a later release makes it pass.
#
# Node itself is not covered by Dependabot: node-lts.yml moves .nvmrc.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
