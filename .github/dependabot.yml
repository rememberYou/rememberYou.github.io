# Monthly, grouped: one pull request per ecosystem rather than one per package.
# A release is only proposed once it is 14 days old: long enough for a broken
# release to be caught and fixed upstream before it reaches this site.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6. Lift this once it
      # supports 7, or the build fails.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
